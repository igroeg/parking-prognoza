spring.application.name=parking-prognoza

# --- Database: local H2 file by default; set SPRING_DATASOURCE_URL etc. for PostgreSQL ---
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/parking-prognoza}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Behind a reverse proxy (Caddy, nginx, Fly.io...) trust X-Forwarded-* so generated links use the public host.
server.forward-headers-strategy=framework

# --- Public URL (used in mail links and the calendar feed) ---
app.base-url=${BASE_URL:http://localhost:8080}

# --- Admin page (/admin) ---
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}

# --- Mail. Leave MAIL_HOST empty to only log mails (local development). ---
# Works with any SMTP provider, e.g. Brevo (smtp-relay.brevo.com:587) or Gmail with an app password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:Паркинг прогноза <no-reply@localhost>}

# --- Jobs (Europe/Sofia time) ---
app.jobs.enabled=true
app.jobs.sync-cron=0 0 6,18 * * *
app.jobs.notify-cron=0 30 7 * * *

# --- Sources ---
app.sources.artvent.enabled=true
app.sources.bilet-bg.enabled=true
app.sources.bilet-bg.venue-urls=https://bilet.bg/bg/venues/vassil-levski-national-stadium-640

# Football via FotMob: upcoming home matches of these teams, kept only if played at a nearby stadium.
app.sources.football.enabled=true
app.sources.football.teams=10144:cska-sofia,8632:levski-sofia,10150:bulgaria
app.sources.football.venue-keywords=Vasil Levski,Armiya,Armija,Armia,Васил Левски,Армия

# go-sofia.com aggregates Eventim, bilet.bg etc. and publishes ticket availability.
# More venues can be added comma-separated. Not used for Vidas Art Arena: in Nov 2026 go-sofia listed
# its old events re-dated to 2027 (e.g. The Prodigy, really 02.08.2026) - the arena's own site is used instead.
app.sources.go-sofia.enabled=true
app.sources.go-sofia.venue-urls=https://www.go-sofia.com/venues/stadion-vasil-levski

# Vidas Art Arena (Kolodrum, Borisova gradina) from vidasartarena.bg
app.sources.vidas.enabled=true
